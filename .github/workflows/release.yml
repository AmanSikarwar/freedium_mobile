name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release Version Name (e.g., 1.0.0)"
        required: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-release:
    name: Build signed release APKs
    needs: verify
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.release_version.outputs.prerelease }}
    env:
      RELEASE_VERSION: ${{ inputs.version_name }}
      RELEASE_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: "3.47.5"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Validate and update release version
        id: release_version
        run: dart run tool/set_release_version.dart "$RELEASE_VERSION" "$RELEASE_BUILD_NUMBER"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/my-release-key.keystore

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=my-release-key.keystore\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Build Android APKs
        run: bash tool/build_release_apks.sh "$RELEASE_VERSION" "$RELEASE_BUILD_NUMBER"

      - name: Upload debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: debug-symbols-${{ inputs.version_name }}
          path: build/debug-info/
          retention-days: 90
          if-no-files-found: error

      - name: Package release symbols
        env:
          RELEASE_VERSION: ${{ inputs.version_name }}
          RELEASE_BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 tool/package_release_symbols.py

      - name: Upload release symbol bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-symbols-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release-symbols/freedium-v${{ inputs.version_name }}-build${{ github.run_number }}-symbols.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed release APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-apks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 7

  smoke-release:
    name: Smoke test signed x86_64 release APK
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-apks-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-apks

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install release-apks/app-x86_64-release.apk
            python3 tool/android_release_smoke.py

  publish-release:
    name: Publish release after APK smoke test
    needs: [build-release, smoke-release]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-apks-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-apks

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-symbols-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-symbols

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: v${{ inputs.version_name }}
          commit: ${{ github.sha }}
          name: Release v${{ inputs.version_name }}
          draft: false
          prerelease: ${{ needs.build-release.outputs.prerelease }}
          artifacts: |
            release-apks/app-arm64-v8a-release.apk
            release-apks/app-armeabi-v7a-release.apk
            release-apks/app-x86_64-release.apk
            release-symbols/freedium-v${{ inputs.version_name }}-build${{ github.run_number }}-symbols.zip
          generateReleaseNotes: true
