name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release Version Name (e.g., 1.0.0)"
        required: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-release:
    name: Build signed release APKs
    needs: verify
    runs-on: macos-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      prerelease: ${{ steps.release_version.outputs.prerelease }}
    env:
      RELEASE_VERSION: ${{ inputs.version_name }}
      RELEASE_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Validate and update release version
        id: release_version
        run: dart run tool/set_release_version.dart "$RELEASE_VERSION" "$RELEASE_BUILD_NUMBER"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/my-release-key.keystore

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=my-release-key.keystore\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Build Android APKs
        run: bash tool/build_release_apks.sh "$RELEASE_VERSION" "$RELEASE_BUILD_NUMBER"

      - name: Record APK checksums and signing certificates
        working-directory: build/app/outputs/flutter-apk
        run: |
          shasum -a 256 app-*-release.apk > SHA256SUMS
          shasum -a 256 --check SHA256SUMS
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n 1)
          test -n "$apksigner"
          for apk in app-*-release.apk; do
            echo "$apk"
            "$apksigner" verify --print-certs "$apk"
          done > SIGNING-CERTIFICATES.txt

      - name: Attest signed APK provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Upload debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-symbols-${{ inputs.version_name }}
          path: build/debug-info/
          retention-days: 90
          if-no-files-found: error

      - name: Package release symbols
        env:
          RELEASE_VERSION: ${{ inputs.version_name }}
          RELEASE_BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 tool/package_release_symbols.py

      - name: Upload release symbol bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-symbols-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release-symbols/freedium-v${{ inputs.version_name }}-build${{ github.run_number }}-symbols.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed release APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS
            build/app/outputs/flutter-apk/SIGNING-CERTIFICATES.txt
          if-no-files-found: error
          retention-days: 7

  smoke-release:
    name: Smoke test signed x86_64 release APK
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apks-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-apks

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache emulator snapshot
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-x86_64

      - name: Create emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install release-apks/app-x86_64-release.apk
            python3 tool/android_release_smoke.py

  publish-release:
    name: Publish release after APK smoke test
    needs: [build-release, smoke-release]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apks-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-apks

      - name: Verify downloaded APK checksums
        working-directory: release-apks
        run: sha256sum --check SHA256SUMS

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-symbols-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-symbols

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: v${{ inputs.version_name }}
          commit: ${{ github.sha }}
          name: Release v${{ inputs.version_name }}
          draft: false
          prerelease: ${{ needs.build-release.outputs.prerelease }}
          artifacts: |
            release-apks/app-arm64-v8a-release.apk
            release-apks/app-armeabi-v7a-release.apk
            release-apks/app-x86_64-release.apk
            release-apks/SHA256SUMS
            release-apks/SIGNING-CERTIFICATES.txt
            release-symbols/freedium-v${{ inputs.version_name }}-build${{ github.run_number }}-symbols.zip
          generateReleaseNotes: true
